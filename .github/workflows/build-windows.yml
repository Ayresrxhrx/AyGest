name: Build AyGest Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: aygest_desktop/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r aygest_desktop/requirements.txt
          python -m pip install pyinstaller>=6.11

      - name: Validate Python source
        run: python -m compileall -q aygest_desktop

      - name: Build executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name AyGest
          --paths .
          --hidden-import customtkinter
          --hidden-import PIL
          --hidden-import reportlab
          aygest_desktop/entry.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/AyGest.exe')) { throw 'AyGest.exe não foi criado.' }
          Get-Item 'dist/AyGest.exe' | Select-Object Name,Length,LastWriteTime

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AyGest-Windows
          path: dist/AyGest.exe
          if-no-files-found: error
          retention-days: 14
