name: Build AyGest Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Detect WPF project
        id: project
        shell: pwsh
        run: |
          $project = Get-ChildItem -Path . -Filter *.csproj -Recurse |
            Where-Object { $_.FullName -match 'AyGest.Wpf' } |
            Select-Object -First 1
          if (-not $project) { throw 'Projecto AyGest.Wpf não encontrado.' }
          "path=$($project.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Projecto: $($project.FullName)"

      - name: Restore
        shell: pwsh
        run: dotnet restore "${{ steps.project.outputs.path }}"

      - name: Build Release
        shell: pwsh
        run: dotnet build "${{ steps.project.outputs.path }}" -c Release --no-restore

      - name: Publish Windows x64
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force ./publish -ErrorAction SilentlyContinue
          dotnet publish "${{ steps.project.outputs.path }}" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o ./publish

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem ./publish -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw 'O build não gerou nenhum EXE.' }
          Write-Host "EXE gerado: $($exe.FullName)"
          Write-Host "Tamanho: $($exe.Length) bytes"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AyGest-Windows-x64
          path: ./publish/*.exe
          if-no-files-found: error
          retention-days: 30
