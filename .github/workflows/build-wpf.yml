name: Build AyGest WPF
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore AyGest.Wpf/AyGest.Wpf.csproj
      - name: Build
        run: dotnet build AyGest.Wpf/AyGest.Wpf.csproj -c Release --no-restore
      - name: Publish EXE
        run: dotnet publish AyGest.Wpf/AyGest.Wpf.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AyGest-WPF-win-x64
          path: publish/*
          if-no-files-found: error
          retention-days: 14
